<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lịch đặt của tôi | Pdun.Foto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/my-bookings.css" />
    <link rel="stylesheet" href="/css/account-header.css" />
  </head>
  <body>
    <header class="bookings-header">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span>Pdun.Foto</a>
      <nav aria-label="Điều hướng chính">
        <a href="/pages/photographers.html">Nhiếp ảnh gia</a>
        <a href="/pages/booking.html">Đặt lịch</a>
        <a class="active" href="/pages/my-bookings.html">Lịch của tôi</a>
      </nav>
      <a class="account-link" id="accountLink" data-account-link href="/pages/auth.html">Đăng nhập</a>
    </header>

    <main class="bookings-page">
      <div class="page-heading">
        <div><p class="eyebrow">PDUN.FOTO / TÀI KHOẢN</p><h1>Lịch đặt của tôi</h1><p class="heading-copy">Theo dõi tình trạng và thông tin các buổi chụp của bạn.</p></div>
        <a class="new-booking" href="/pages/booking.html"><span aria-hidden="true">＋</span> Đặt buổi chụp</a>
      </div>
      <div class="booking-filters" role="group" aria-label="Lọc lịch đặt">
        <button class="filter-button active" type="button" data-status="all">Tất cả</button>
        <button class="filter-button" type="button" data-status="pending">Chờ xác nhận</button>
        <button class="filter-button" type="button" data-status="confirmed">Đã xác nhận</button>
        <button class="filter-button" type="button" data-status="completed">Hoàn tất</button>
        <button class="filter-button" type="button" data-status="cancelled">Đã hủy</button>
      </div>
      <p id="listStatus" class="list-status" role="status" aria-live="polite">Đang tải lịch đặt...</p>
      <section id="bookingList" class="booking-list" aria-live="polite"></section>
    </main>

    <footer class="bookings-footer"><a href="/">Pdun.Foto</a><span>Hỗ trợ đặt lịch chụp hình</span></footer>
    <script src="/js/my-bookings.js"></script>
    <script src="/js/account-header.js"></script>
  </body>
</html>
