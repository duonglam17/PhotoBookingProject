<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Đặt lại mật khẩu Pdun.Foto bằng mã xác nhận gửi tới email." />
    <title>Đặt lại mật khẩu | Pdun.Foto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/forgot-password.css" />
  </head>
  <body>
    <main class="reset-shell">
      <a class="reset-brand" href="/" aria-label="Pdun.Foto trang chủ"><span class="brand-mark" aria-hidden="true"></span>Pdun.Foto</a>
      <section class="reset-panel" aria-labelledby="resetTitle">
        <a class="back-link" href="/pages/auth.html">← Quay lại đăng nhập</a>
        <p class="eyebrow">KHÔI PHỤC TÀI KHOẢN</p>
        <h1 id="resetTitle">Quên mật khẩu?</h1>
        <p id="resetIntro" class="intro-copy">Nhập email tài khoản. Chúng tôi sẽ gửi mã xác nhận để bạn tạo mật khẩu mới.</p>

        <div id="stepTrack" class="step-track" aria-label="Các bước đặt lại mật khẩu">
          <span class="step active" id="emailStep">1 <small>Email</small></span><i></i><span class="step" id="codeStep">2 <small>Xác nhận</small></span>
        </div>

        <form id="requestCodeForm" novalidate>
          <label class="field-label" for="resetEmail">Email tài khoản</label>
          <input id="resetEmail" class="field-input" type="email" autocomplete="email" placeholder="name@example.com" required />
          <button id="sendCodeButton" class="primary-button" type="submit">Gửi mã xác nhận</button>
        </form>

        <form id="verifyCodeForm" hidden novalidate>
          <label class="field-label" for="verificationCode">Mã xác nhận 6 số</label>
          <input id="verificationCode" class="field-input code-input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" required />
          <p class="code-hint">Nhập mã gửi tới <strong id="sentEmailLabel"></strong>. Mã có hiệu lực trong 10 phút.</p>
          <label class="field-label" for="newPassword">Mật khẩu mới</label>
          <input id="newPassword" class="field-input" type="password" autocomplete="new-password" minlength="8" maxlength="32" placeholder="Từ 8 đến 32 ký tự" required />
          <label class="field-label" for="confirmPassword">Xác nhận mật khẩu mới</label>
          <input id="confirmPassword" class="field-input" type="password" autocomplete="new-password" minlength="8" maxlength="32" placeholder="Nhập lại mật khẩu mới" required />
          <button id="resetPasswordButton" class="primary-button" type="submit">Đổi mật khẩu</button>
          <button id="resendCodeButton" class="text-button" type="button">Gửi lại mã</button>
        </form>

        <p id="resetStatus" class="reset-status" role="status" aria-live="polite"></p>
        <a id="returnToLogin" class="return-link" href="/pages/auth.html" hidden>Quay lại đăng nhập</a>
      </section>
      <footer>Pdun.Foto <span>·</span> Bảo mật tài khoản</footer>
    </main>
    <script src="/js/forgot-password.js"></script>
  </body>
</html>
